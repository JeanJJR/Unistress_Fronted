<div class="configuracion-solo">
  <h2 class="text-wrapper-2">Configuraciones</h2>

  <div class="config-bloques">
    <!-- Tema -->
    <div class="config-bloque">
      <div class="recordatorio-de-test"><span class="span">Tema y accesibilidad:</span></div>
      <div class="boton-grupo">
        <button class="button" (click)="cambiarTema('claro')" [class.active]="tema === 'claro'">
          <div class="content"><div class="state-layer"><span class="label">Modo claro</span></div></div>
        </button>
        <button class="button" (click)="cambiarTema('oscuro')" [class.active]="tema === 'oscuro'">
          <div class="content"><div class="state-layer"><span class="label">Modo oscuro</span></div></div>
        </button>
      </div>
    </div>

    <!-- Fuente -->
    <div class="config-bloque">
      <div class="recordatorio-de-test"><span class="span">Tamaño de fuente:</span></div>
      <div class="boton-grupo fuente">
        <button class="button" (click)="ajustarFuente(-1)">
          <div class="content"><div class="state-layer"><span class="label">A-</span></div></div>
        </button>
        <span class="font-size-value">{{ fontSize }}px</span>
        <button class="button" (click)="ajustarFuente(1)">
          <div class="content"><div class="state-layer"><span class="label">A+</span></div></div>
        </button>
      </div>
    </div>

    <!-- Soporte -->
    <div class="config-bloque">
      <div class="recordatorio-de-test"><span class="span">Ayuda y soporte:</span></div>
      <div class="boton-grupo soporte">
        <a href="/ayuda" class="config-link">Centro de ayuda</a>
        <button class="button" (click)="contactarSoporte()">
          <div class="content"><div class="state-layer"><span class="label">Contactar soporte</span></div></div>
        </button>
      </div>
      <div class="version-info">Versión: 1.0.0</div>
    </div>
  </div>
</div>
