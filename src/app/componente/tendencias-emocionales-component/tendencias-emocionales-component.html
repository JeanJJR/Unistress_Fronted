<section class="page">
  <h2 class="titulo">Tendencias de emociones</h2>

  <div class="filters">
    <mat-form-field appearance="outline">
      <mat-label>Fecha inicial</mat-label>
      <input matInput [matDatepicker]="pickerInicio" [(ngModel)]="startDate" (dateChange)="onFilterChange()">
      <mat-datepicker-toggle matSuffix [for]="pickerInicio"></mat-datepicker-toggle>
      <mat-datepicker #pickerInicio></mat-datepicker>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Fecha final</mat-label>
      <input matInput [matDatepicker]="pickerFin" [(ngModel)]="endDate" (dateChange)="onFilterChange()">
      <mat-datepicker-toggle matSuffix [for]="pickerFin"></mat-datepicker-toggle>
      <mat-datepicker #pickerFin></mat-datepicker>
    </mat-form-field>
  </div>

  <div class="chart-wrap">
    <canvas #chartCanvas aria-label="Gráfico de tendencias de emociones"></canvas>
  </div>
</section>
